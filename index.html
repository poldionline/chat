<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SwapChat</title>
<style>
  :root{--bg:#0f1419;--panel:#1a212b;--line:#2a3441;--text:#e6edf3;--mute:#8b98a8;--acc:#3ea6ff;--me:#1f4e79;--err:#f85149}
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--text);font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
  button,input{font:inherit;color:inherit}
  input{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
  button{background:var(--acc);color:#04121f;border:0;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer}
  button.sec{background:var(--line);color:var(--text)}
  #login{max-width:380px;margin:10vh auto;padding:24px;background:var(--panel);border:1px solid var(--line);border-radius:14px;display:flex;flex-direction:column;gap:12px}
  #login h1{margin:0;font-size:22px}
  #login p{margin:0;color:var(--mute);font-size:13px}
  #err{color:var(--err);font-size:13px;min-height:1em}
  #app{display:none;height:100%;grid-template-columns:1fr 300px}
  #chatcol{display:flex;flex-direction:column;min-width:0;height:100%}
  header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px}
  #status{font-size:12px;color:var(--mute)}
  #msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
  .m{max-width:75%;padding:8px 12px;border-radius:12px;background:var(--panel);border:1px solid var(--line);align-self:flex-start;overflow-wrap:anywhere}
  .m.me{align-self:flex-end;background:var(--me);border-color:transparent}
  .m .n{font-size:11px;color:var(--mute)}
  .sys{align-self:center;color:var(--mute);font-size:12px}
  .sys a{color:var(--acc)}
  form{display:flex;gap:8px;padding:12px;border-top:1px solid var(--line)}
  aside{border-left:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;min-height:0;height:100%;overflow-y:auto}
  aside h2{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:0;padding:14px 14px 6px}
  .list{padding:0 10px 10px}
  .f{display:flex;align-items:center;gap:8px;padding:8px;border:1px solid var(--line);border-radius:8px;margin-top:6px;background:var(--bg)}
  .f .i{flex:1;min-width:0}
  .f .i div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .f small{color:var(--mute)}
  .f button{padding:6px 10px;font-size:13px}
  .bar{height:3px;background:var(--line);border-radius:2px;margin-top:4px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--acc)}
  .empty{color:var(--mute);font-size:13px;padding:6px 4px}
  #drop{margin:6px 10px;padding:14px;border:2px dashed var(--line);border-radius:10px;text-align:center;color:var(--mute);cursor:pointer;font-size:13px}
  @media(max-width:760px){
    #app{grid-template-columns:1fr;grid-template-rows:1fr 42vh}
    aside{border-left:0;border-top:1px solid var(--line)}
    .m{max-width:90%}
  }
</style>
</head>
<body>

<div id="login">
  <h1>SwapChat</h1>
  <p>Chat und Dateitausch in passwortgeschützten Gruppen. Kein Konto, kein Server.</p>
  <input id="name" placeholder="Dein Name" maxlength="24" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
  <input id="group" placeholder="Gruppenname" maxlength="40" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
  <input id="pw" type="password" placeholder="Gruppenpasswort" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">
  <div id="err"></div>
  <button id="join">Beitreten</button>
  <button id="mic" class="sec" type="button">Nur Safari: Netzwerk freischalten</button>
</div>

<div id="app">
  <div id="chatcol">
    <header>
      <div><b id="gname"></b> <small style="color:var(--mute)">v8</small><div id="status">Verbinde …</div></div>
      <button class="sec" id="leave">Verlassen</button>
    </header>
    <div id="msgs"></div>
    <form id="form">
      <input id="text" placeholder="Nachricht schreiben …" autocomplete="off">
      <button>Senden</button>
    </form>
  </div>
  <aside>
    <h2>Meine Angebote</h2>
    <div id="drop">Dateien hierher ziehen oder tippen</div>
    <input type="file" id="pick" multiple hidden>
    <div class="list" id="mine"></div>
    <h2>Angebote der Gruppe</h2>
    <div class="list" id="theirs"></div>
  </aside>
</div>

<script type="module">
import {joinRoom, selfId} from 'https://cdn.jsdelivr.net/npm/trystero@0.21/+esm';

// Optional: TURN-Server für zusätzliche Sicherheit bei schwierigen Netzen (leer lassen = nur Umweg über andere Teilnehmer)
// Beispiel: [{urls:'turn:host:3478', username:'user', credential:'pass'}]
const TURN = [];

const $ = id => document.getElementById(id);
const fmt = b => b < 1024 ? b + ' B' : b < 1048576 ? (b/1024).toFixed(1) + ' KB' : (b/1048576).toFixed(1) + ' MB';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2);

const names = {};        // peerId -> Name
const myFiles = new Map(); // id -> File
const theirOffers = {};  // peerId -> [{id,name,size}]
const bars = {};         // "peerId:id" -> Fortschrittsbalken
let room, myName = '';

function push(el){
  const box = $('msgs');
  const atEnd = box.scrollHeight - box.scrollTop - box.clientHeight < 80;
  box.append(el);
  if(atEnd) box.scrollTop = box.scrollHeight;
}
function addMsg(text, who, me){
  const d = document.createElement('div'); d.className = 'm' + (me ? ' me' : '');
  const n = document.createElement('div'); n.className = 'n'; n.textContent = who;
  const t = document.createElement('div'); t.textContent = text;
  d.append(n, t); push(d);
}
function sys(text, node){
  const d = document.createElement('div'); d.className = 'sys'; d.textContent = text;
  if(node) d.append(' ', node);
  push(d);
}
function updateStatus(){
  const list = Object.values(names);
  $('status').textContent = list.length
    ? `Online (${list.length + 1}): du, ` + list.join(', ')
    : 'Online (1): nur du – warte auf Mitglieder …';
}

// Safari gibt lokale Netzwerk-Adressen nur frei, wenn einmal Mikrofonzugriff erlaubt wurde (es wird nichts aufgenommen).
$('mic').onclick = async () => {
  try{
    const st = await navigator.mediaDevices.getUserMedia({audio: true});
    st.getTracks().forEach(t => t.stop());
    $('mic').textContent = '✔ Freigeschaltet';
  }catch(e){ $('mic').textContent = '✘ Nicht möglich'; }
};

$('join').onclick = join;
['name','group','pw'].forEach(i => $(i).addEventListener('keydown', e => { if(e.key === 'Enter') join(); }));

function join(){
  const name = $('name').value.trim();
  const group = $('group').value.trim().toLowerCase();
  const pw = $('pw').value;
  if(!name || !group || !pw){ $('err').textContent = 'Bitte alle drei Felder ausfüllen.'; return; }
  myName = name;

  room = joinRoom(Object.assign({appId: 'swapchat-github-v8', password: pw}, TURN.length ? {turnConfig: TURN} : {}), 'g:' + group);

  const me = selfId;
  const [sendEnv, onEnv]           = room.makeAction('env');
  const [sendFile, onFile, onProg] = room.makeAction('file');

  // ---- Überlagertes Netz: Nachrichten laufen bei Bedarf über andere Teilnehmer weiter ----
  const direct = new Set();      // direkt verbundene Teilnehmer
  const route = {};              // Ziel -> direkter Nachbar, über den es erreichbar ist
  const lastSeen = {};           // Teilnehmer -> letzter Kontakt
  const sigs = {};               // Teilnehmer -> Signatur (Name+Angebote), um unnötiges Neuzeichnen zu vermeiden
  const seenIds = new Set();
  const outFlight = new Set();
  const lastProg = {};
  const barPct = {};

  const myOfferList = () => [...myFiles].map(([id, f]) => ({id, name: f.name, size: f.size}));
  const hopFor = x => direct.has(x) ? x : (route[x] && direct.has(route[x]) ? route[x] : null);
  const mk = (t, extra, to) => Object.assign({id: uid(), from: me, to: to || null, ttl: 8, t}, extra);
  function remember(id){ seenIds.add(id); if(seenIds.size > 3000) seenIds.delete(seenIds.values().next().value); }
  function send(env, except){
    remember(env.id);
    if(env.to){
      const h = hopFor(env.to);
      if(h && h !== except){ sendEnv(env, h); return; }
    }
    for(const p of direct) if(p !== except) sendEnv(env, p);
  }
  const announce = () => send(mk('hello', {n: myName, o: myOfferList()}));
  const pushOffers = () => announce();

  function setBar(key, frac){
    const w = Math.max(0, Math.min(100, Math.round(frac * 100)));
    if(w <= (barPct[key] || 0)) return;
    barPct[key] = w;
    const b = bars[key]; if(b) b.style.width = w + '%';
  }
  function removeNode(id){
    if(names[id]) sys(names[id] + ' hat die Gruppe verlassen.');
    delete names[id]; delete theirOffers[id]; delete lastSeen[id]; delete sigs[id]; delete route[id];
    renderTheirs(); updateStatus();
  }

  room.onPeerJoin(p => { direct.add(p); announce(); });
  room.onPeerLeave(p => {
    direct.delete(p);
    for(const k in route) if(route[k] === p) delete route[k];
    removeNode(p);
  });

  onEnv((env, p) => {
    if(!env || typeof env.id !== 'string' || typeof env.from !== 'string' || env.from === me || seenIds.has(env.id)) return;
    remember(env.id);
    if(env.from !== p) route[env.from] = p;
    if(names[env.from]) lastSeen[env.from] = Date.now();
    if(!env.to || env.to === me) handle(env);
    if(env.to !== me && (env.ttl | 0) > 0) send(Object.assign({}, env, {ttl: env.ttl - 1}), p);
  });

  async function handle(env){
    const from = env.from;
    switch(env.t){
      case 'hello': {
        const first = !names[from];
        const nm = String(env.n || 'Unbekannt').slice(0, 24);
        const offers = Array.isArray(env.o) ? env.o.slice(0, 200) : [];
        names[from] = nm; theirOffers[from] = offers; lastSeen[from] = Date.now();
        if(first){
          sys(nm + ' ist beigetreten.');
          if(!env.r) send(mk('hello', {n: myName, o: myOfferList(), r: 1}, from));
        }
        const sig = nm + JSON.stringify(offers);
        if(first || sigs[from] !== sig){ sigs[from] = sig; renderTheirs(); }
        updateStatus();
        break;
      }
      case 'chat':
        addMsg(String(env.text).slice(0, 4000), String(env.n || names[from] || 'Unbekannt').slice(0, 24), false);
        break;
      case 'want': {
        const f = myFiles.get(env.fid), hop = hopFor(from);
        if(!f || !hop) break;
        sys((names[from] || 'Jemand') + ' holt „' + f.name + '“ ab …');
        await sendFile(await f.arrayBuffer(), hop, {id: env.fid, name: f.name, type: f.type, src: me, dst: from, h: 0});
        break;
      }
      case 'prog':
        setBar(env.src + ':' + env.fid, +env.pct || 0);
        break;
      case 'bye':
        removeNode(from);
        break;
    }
  }

  onFile(async (data, p, meta) => {
    if(!meta || !meta.dst) return;
    if(meta.dst !== me){                       // wir sind nur Zwischenstation
      const hop = hopFor(meta.dst);
      if(!hop || hop === p) return;
      const m2 = Object.assign({}, meta, {h: (meta.h || 0) + 1});
      const k = m2.src + ':' + m2.id + ':' + m2.h;
      outFlight.add(k);
      try{ await sendFile(data, hop, m2); } finally { outFlight.delete(k); }
      return;
    }
    const url = URL.createObjectURL(new Blob([data], {type: meta.type || 'application/octet-stream'}));
    const a = document.createElement('a');
    a.href = url; a.download = meta.name; a.textContent = '↓ ' + meta.name;
    sys('Datei von ' + (names[meta.src] || 'Unbekannt') + ' erhalten:', a);
    setBar(meta.src + ':' + meta.id, 1);
    a.click();
  });

  onProg((pct, p, meta) => {
    if(!meta || !meta.id || meta.src === me) return;
    if(outFlight.has(meta.src + ':' + meta.id + ':' + (meta.h || 0))) return;   // eigener Weitertransport
    if(meta.dst === me){ setBar(meta.src + ':' + meta.id, (meta.h || 0) > 0 ? 0.5 + pct / 2 : pct); return; }
    const k = meta.src + meta.id;                                               // wir leiten weiter: Fortschritt an Empfänger melden
    if(pct < 1 && pct - (lastProg[k] || 0) < 0.05) return;
    lastProg[k] = pct;
    send(mk('prog', {fid: meta.id, src: meta.src, pct: pct / 2}, meta.dst));
  });

  setInterval(announce, 8000);
  setInterval(() => { const now = Date.now(); for(const id in lastSeen) if(now - lastSeen[id] > 26000) removeNode(id); }, 5000);
  addEventListener('pagehide', () => send(mk('bye')));
  window.__leave = () => { send(mk('bye')); setTimeout(() => { room.leave(); location.reload(); }, 150); };

  // Chat
  $('form').onsubmit = e => {
    e.preventDefault();
    const t = $('text').value.trim();
    if(!t) return;
    send(mk('chat', {text: t, n: myName}));
    addMsg(t, myName, true);
    $('text').value = '';
  };

  // Dateien anbieten
  const addFiles = files => {
    for(const f of files) myFiles.set(uid(), f);
    renderMine(); pushOffers();
  };
  $('drop').onclick = () => $('pick').click();
  $('pick').onchange = e => { addFiles(e.target.files); e.target.value = ''; };
  $('drop').ondragover = e => e.preventDefault();
  $('drop').ondrop = e => { e.preventDefault(); addFiles(e.dataTransfer.files); };

  function renderMine(){
    const box = $('mine'); box.textContent = '';
    if(!myFiles.size){ box.innerHTML = '<div class="empty">Noch nichts angeboten.</div>'; return; }
    for(const [id, f] of myFiles){
      const row = document.createElement('div'); row.className = 'f';
      const info = document.createElement('div'); info.className = 'i';
      const nm = document.createElement('div'); nm.textContent = f.name;
      const sz = document.createElement('small'); sz.textContent = fmt(f.size);
      info.append(nm, sz);
      const b = document.createElement('button'); b.className = 'sec'; b.textContent = 'Entfernen';
      b.onclick = () => { myFiles.delete(id); renderMine(); pushOffers(); };
      row.append(info, b); box.append(row);
    }
  }

  function renderTheirs(){
    const box = $('theirs'); box.textContent = '';
    let any = false;
    for(const p in theirOffers){
      for(const o of theirOffers[p]){
        any = true;
        const row = document.createElement('div'); row.className = 'f';
        const info = document.createElement('div'); info.className = 'i';
        const nm = document.createElement('div'); nm.textContent = o.name;
        const sz = document.createElement('small'); sz.textContent = fmt(o.size) + ' · von ' + (names[p] || 'Unbekannt');
        const bar = document.createElement('div'); bar.className = 'bar';
        const fill = document.createElement('i'); bar.append(fill);
        bars[p + ':' + o.id] = fill;
        info.append(nm, sz, bar);
        const b = document.createElement('button'); b.textContent = 'Holen';
        const key = p + ':' + o.id;
        fill.style.width = (barPct[key] || 0) + '%';
        b.onclick = () => { setBar(key, 0.02); send(mk('want', {fid: o.id}, p)); };
        row.append(info, b); box.append(row);
      }
    }
    if(!any) box.innerHTML = '<div class="empty">Noch keine Angebote in der Gruppe.</div>';
  }
  
  $('login').style.display = 'none';
  $('app').style.display = 'grid';
  $('gname').textContent = '🔒 ' + group;
  renderMine(); renderTheirs(); updateStatus();
  sys('Nachrichten werden nicht gespeichert – nur wer online ist, empfängt sie.');
  $('text').focus();
}

$('leave').onclick = () => { if(window.__leave) window.__leave(); else location.reload(); };
</script>
</body>
</html>
